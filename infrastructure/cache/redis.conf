# Real-Time Document Intelligence & Compliance Engine
# Redis Configuration
# Version: 1.0
# Date: 2026-02-03

# =============================================================================
# BASIC REDIS CONFIGURATION
# =============================================================================

# Network and Security
bind 0.0.0.0
port 6379
protected-mode yes
requirepass ${REDIS_PASSWORD}

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence Configuration
# AOF for data safety with checkpoint-based recovery
appendonly yes
appendfilename "redis-appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots (backup strategy)
save 900 1     # Save if at least 1 key changed in 900 seconds
save 300 10    # Save if at least 10 keys changed in 300 seconds
save 60 10000  # Save if at least 10000 keys changed in 60 seconds

# Logging
loglevel notice
logfile "/var/log/redis/redis-server.log"

# Client Configuration
tcp-keepalive 300
timeout 0
tcp-backlog 511

# =============================================================================
# STREAM CONFIGURATION FOR DOCUMENT PROCESSING QUEUES
# =============================================================================

# Stream retention policy - keep for 24 hours or max 10000 entries per stream
# This will be applied to our priority queues:
# - documents:queue:high
# - documents:queue:normal
# - documents:queue:retry

# Maximum stream length configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# =============================================================================
# CLUSTER CONFIGURATION (for high availability)
# =============================================================================

# Uncomment for cluster mode (production)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000
# cluster-require-full-coverage no

# =============================================================================
# MEMORY OPTIMIZATION
# =============================================================================

# Hash optimization for small objects
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# =============================================================================
# SLOW LOG CONFIGURATION
# =============================================================================

# Log queries slower than 10ms (10000 microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# CLIENT OUTPUT BUFFER LIMITS
# =============================================================================

# Normal clients
client-output-buffer-limit normal 0 0 0

# Replica clients
client-output-buffer-limit replica 256mb 64mb 60

# Pub/sub clients (important for our alert system)
client-output-buffer-limit pubsub 32mb 8mb 60
