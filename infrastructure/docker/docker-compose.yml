# Real-Time Document Intelligence & Compliance Engine
# Docker Compose for Local Development Environment
# Version: 1.0
# Date: 2026-02-03

version: "3.8"

services:
  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================

  # PostgreSQL - Primary relational database
  postgres:
    image: postgres:15-alpine
    container_name: docintell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: docintell_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - docintell_network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U docintell_user -d document_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - Knowledge graph database
  neo4j:
    image: neo4j:5.11-community
    container_name: docintell-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dev_password_123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_export_file_enabled: true
      NEO4J_apoc_import_file_enabled: true
      NEO4J_apoc_import_file_use__neo4j__config: true
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474" # Web interface
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/var/lib/neo4j/conf
      - ./infrastructure/database/neo4j_schema.cypher:/var/lib/neo4j/import/schema.cypher:ro
    networks:
      - docintell_network
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "${NEO4J_PASSWORD:-dev_password_123}",
          "MATCH (n) RETURN count(n)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis - Cache, queues, and pub/sub
  redis:
    image: redis:7-alpine
    container_name: docintell-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_password_123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/cache/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - docintell_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =============================================================================
  # STORAGE SERVICES
  # =============================================================================

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: docintell-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_password_123}
      MINIO_DOMAIN: localhost
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    networks:
      - docintell_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Initialize MinIO buckets
  minio-init:
    image: minio/mc:latest
    container_name: docintell-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_password_123}
    networks:
      - docintell_network
    entrypoint: >
      /bin/sh -c "
      mc config host add minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing minio/docintell-documents-raw;
      mc mb --ignore-existing minio/docintell-documents-processed;
      mc mb --ignore-existing minio/docintell-documents-checkpoints;
      mc mb --ignore-existing minio/docintell-models;
      mc mb --ignore-existing minio/docintell-backups;
      mc mb --ignore-existing minio/docintell-temp;
      mc policy set download minio/docintell-documents-raw;
      mc policy set download minio/docintell-documents-processed;
      echo 'MinIO buckets created successfully';
      "

  # =============================================================================
  # VECTOR STORE SERVICE
  # =============================================================================

  # Weaviate - Vector database for embeddings
  weaviate:
    image: semitechnologies/weaviate:1.21.8
    container_name: docintell-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: "text2vec-openai,text2vec-cohere,text2vec-huggingface,ref2vec-centroid,generative-openai,qna-openai"
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8080:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - docintell_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # MESSAGE QUEUE AND TASK PROCESSING
  # =============================================================================

  # Celery Worker for document processing
  celery-worker:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: docintell-celery-worker
    restart: unless-stopped
    environment:
      CELERY_BROKER: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
      DATABASE_URL: postgresql://docintell_user:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/document_intelligence
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j:${NEO4J_PASSWORD:-dev_password_123}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev_password_123}
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    volumes:
      - ./:/app
      - /tmp/docintell:/tmp/docintell
    networks:
      - docintell_network
    command: celery -A document_processing.celery worker --loglevel=info --concurrency=4

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: docintell-celery-beat
    restart: unless-stopped
    environment:
      CELERY_BROKER: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
      DATABASE_URL: postgresql://docintell_user:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/document_intelligence
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - docintell_network
    command: celery -A document_processing.celery beat --loglevel=info

  # =============================================================================
  # MONITORING AND OBSERVABILITY
  # =============================================================================

  # Flower - Celery monitoring
  flower:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: docintell-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER: redis://:${REDIS_PASSWORD:-dev_password_123}@redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    volumes:
      - ./:/app
    networks:
      - docintell_network
    command: celery -A document_processing.celery flower --port=5555

  # Redis Commander - Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: docintell-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-dev_password_123}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - docintell_network

  # =============================================================================
  # DEVELOPMENT UTILITIES
  # =============================================================================

  # pgAdmin - PostgreSQL GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docintell-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@docintell.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dev_password_123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: '"DocIntell Development Environment"'
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/docker/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - docintell_network

  # Adminer - Lightweight database management
  adminer:
    image: adminer:latest
    container_name: docintell-adminer
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres
    networks:
      - docintell_network

# =============================================================================
# NETWORKS AND VOLUMES
# =============================================================================

networks:
  docintell_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_conf:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  weaviate_data:
    driver: local
  pgadmin_data:
    driver: local
